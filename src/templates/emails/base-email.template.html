<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{SUBJECT}} - TeamLens</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos consistentes con la aplicación TeamLens */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #F8F9FA;
            color: #3a3a3a;
            line-height: 1.6;
        }
        
        .email-container {
            max-width: 600px;
            margin: 40px auto;
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(40, 40, 40, 0.1);
        }
        
        .header {
            background: linear-gradient(-30deg, #8284ff 20%, #2196F3 35%, #0647f8 100%);
            padding: 30px;
            text-align: center;
            color: white;
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 600;
            margin: 0;
        }
        
        .header .subtitle {
            font-size: 14px;
            font-weight: 300;
            margin-top: 8px;
            opacity: 0.9;
        }
        
        .content {
            padding: 40px 30px;
        }
        
        .content h2 {
            color: #3a3a3a;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        
        .content p {
            font-size: 16px;
            margin-bottom: 20px;
            color: #555;
        }
        
        .cta-button {
            display: inline-block;
            background: linear-gradient(90deg, #0647f8, #2196F3);
            color: white;
            padding: 14px 32px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            margin: 20px 0;
            transition: all 0.3s ease;
            border: none;
            text-align: center;
        }
        
        .cta-button:hover {
            background: linear-gradient(90deg, #0537d1, #1976D2);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(6, 71, 248, 0.3);
        }
        
        .info-box {
            background: linear-gradient(90deg, rgba(206, 223, 255, 1) 80%, transparent 100%);
            padding: 16px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #2196F3;
        }
        
        .url-fallback {
            background-color: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            font-size: 12px;
            color: #666;
            word-break: break-all;
            border: 1px solid #e9ecef;
        }
        
        .footer {
            background-color: #f8f9fa;
            padding: 25px 30px;
            text-align: center;
            border-top: 1px solid #e9ecef;
        }
        
        .footer p {
            font-size: 12px;
            color: #999;
            margin: 5px 0;
        }
        
        .footer .company-info {
            font-weight: 500;
            color: #666;
        }
        
        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #e9ecef, transparent);
            margin: 30px 0;
        }
        
        /* Responsive */
        @media (max-width: 600px) {
            .email-container {
                margin: 20px;
                border-radius: 8px;
            }
            
            .header, .content, .footer {
                padding: 20px;
            }
            
            .cta-button {
                display: block;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="email-container">
        <!-- Header -->
        <div class="header">
            <h1>🎓 TeamLens</h1>
            <p class="subtitle">Plataforma de Gestión de Equipos Educativos</p>
        </div>
        
        <!-- Content -->
        <div class="content">
            {{CONTENT}}
        </div>
        
        <!-- Footer -->
        <div class="footer">
            <p class="company-info">TeamLens - Sistema de Formación de Equipos</p>
            <p>Este es un mensaje automático. Por favor, no responda a este correo.</p>
            <p>Si tiene consultas, contacte a su profesor o administrador del sistema.</p>
        </div>
    </div>
</body>
</html>

# ============================================================================
# TeamLens Backend - Redis Configuration File
# Configuración optimizada para Celery y cargas de trabajo distribuidas
# ============================================================================

# ============================================================================
# CONFIGURACIÓN DE RED Y SEGURIDAD
# ============================================================================

# Bind a todas las interfaces (cuidado en producción)
bind 0.0.0.0

# Puerto por defecto
port 6379

# Timeout de conexiones inactivas (5 minutos)
timeout 300

# TCP keepalive (60 segundos)
tcp-keepalive 60

# Número máximo de clientes conectados
maxclients 10000

# ============================================================================
# CONFIGURACIÓN DE MEMORIA Y PERSISTENCIA
# ============================================================================

# Política de memoria cuando se alcanza el límite
maxmemory-policy allkeys-lru

# Configuración de RDB (snapshots)
save 900 1      # Guardar si al menos 1 key cambió en 900 segundos
save 300 10     # Guardar si al menos 10 keys cambiaron en 300 segundos
save 60 10000   # Guardar si al menos 10000 keys cambiaron en 60 segundos

# Configuración de AOF (Append Only File)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec    # Sincronizar cada segundo (balance entre rendimiento y durabilidad)

# Compresión de RDB
rdbcompression yes

# Checksum de RDB
rdbchecksum yes

# ============================================================================
# CONFIGURACIÓN DE RENDIMIENTO PARA CELERY
# ============================================================================

# Número de bases de datos (Celery usa diferentes DBs)
databases 16

# Hash table configuración para mejor rendimiento
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List configuración
list-max-ziplist-size -2
list-compress-depth 0

# Set configuración
set-max-intset-entries 512

# Sorted set configuración
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# ============================================================================
# CONFIGURACIÓN DE LOGGING
# ============================================================================

# Nivel de logging
loglevel notice

# Archivo de log (empty = stdout)
logfile ""

# ============================================================================
# CONFIGURACIÓN ESPECÍFICA PARA CELERY
# ============================================================================

# Configuración para mejor rendimiento con listas (colas de Celery)
# Celery usa BLPOP/BRPOP que se benefician de estas configuraciones

# Disable latency monitoring en producción para mejor rendimiento
latency-monitor-threshold 0

# Configuración de slow log
slowlog-log-slower-than 10000  # 10ms
slowlog-max-len 128

# ============================================================================
# CONFIGURACIÓN DE SEGURIDAD AVANZADA
# ============================================================================

# Comandos prohibidos para mayor seguridad
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command DEBUG ""

# Configuración de SSL/TLS (descomentear para producción con SSL)
# tls-port 6380
# port 0
# tls-cert-file /path/to/redis.crt
# tls-key-file /path/to/redis.key
# tls-ca-cert-file /path/to/ca.crt

# ============================================================================
# CONFIGURACIÓN DE CLUSTER (para alta disponibilidad)
# ============================================================================

# Configuración para Redis Cluster (descomentar si se usa cluster)
# cluster-enabled yes
# cluster-config-file nodes-6379.conf
# cluster-node-timeout 15000
# cluster-announce-ip 10.1.1.5
# cluster-announce-port 6379
# cluster-announce-bus-port 16379

# ============================================================================
# CONFIGURACIÓN DE MÓDULOS Y EXTENSIONES
# ============================================================================

# Cargar módulos específicos si son necesarios
# loadmodule /path/to/module.so

# ============================================================================
# CONFIGURACIÓN DE MONITOREO
# ============================================================================

# Habilitar estadísticas de memoria
# memory-usage-tracking yes

# ============================================================================
# CONFIGURACIÓN EXPERIMENTAL/AVANZADA
# ============================================================================

# IO threads para mejor rendimiento en sistemas multi-core
# io-threads 4
# io-threads-do-reads yes

# ============================================================================
# NOTAS DE PRODUCCIÓN AWS
# ============================================================================

# Para AWS ElastiCache, muchas de estas configuraciones se manejan
# automáticamente. Este archivo es principalmente para desarrollo local
# y despliegues auto-gestionados.

# Configuraciones importantes para AWS:
# - Usar Cluster Mode para alta disponibilidad
# - Configurar backups automáticos
# - Usar encryption in-transit y at-rest
# - Configurar VPC security groups apropiados 